name: opencodereview

x-review-image: &review-image
  image: opencodereview-runner:local
  build:
    context: .
    dockerfile: docker/Dockerfile.runner
    additional_contexts:
      ocr_runtime: service:server
    args:
      OCR_RUNTIME_IMAGE: ocr_runtime

x-review-runner: &review-runner
  <<: *review-image
  restart: unless-stopped
  command: [runner]
  init: true
  read_only: true
  pids_limit: 128
  cpus: 1
  mem_limit: 2g
  memswap_limit: 2g
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
  security_opt: [no-new-privileges:true]
  environment:
    OCR_RUNNER_AUTH_ROOT: /claude-auth/app-managed
    OCR_RUNNER_PROXY: http://review-egress:8790
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /work:size=16m,mode=0755
    - /evidence:size=512m,mode=0755
    - /output:size=48m,mode=0777
    - /scratch:size=128m,mode=0755
    - /data:size=1m,mode=0700
  depends_on: [review-egress]
  healthcheck:
    test: [CMD-SHELL, "test -S /ipc/$$(hostname).sock"]
    interval: 5s
    timeout: 2s
    retries: 6
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

x-postgres-image: &postgres-image postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b

services:
  # Creates the database passwords on the first start and keeps them on a volume only the database
  # and the server mount. Nothing has a default password.
  database-secret:
    image: *postgres-image
    network_mode: none
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu
        cd /secret
        for name in password app-password ro-password; do
          [ -s "$$name" ] || (umask 077; tr -dc A-Za-z0-9 < /dev/urandom | head -c 40 > "$$name")
        done
        url() { printf 'postgres://%s:%s@postgres:5432/opencodereview?sslmode=disable' "$$1" "$$(cat "$$2")"; }
        url ocr password > owner-url
        url ocr_app app-password > app-url
        url ocr_ro ro-password > ro-url
        chmod 0444 password app-password ro-password owner-url app-url ro-url
    volumes:
      - database-secret:/secret

  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocr
      POSTGRES_DB: opencodereview
      POSTGRES_PASSWORD_FILE: /secret/password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - database-secret:/secret:ro
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    depends_on:
      database-secret:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ocr -d opencodereview"]
      interval: 2s
      timeout: 2s
      retries: 30
    # Reachable from the server only: never from runners, the egress proxy or the web container.
    networks: [db]

  server:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
      # Codex browser sign-in redirects to 127.0.0.1:1455; forwarded only while a sign-in runs.
      - "127.0.0.1:1455:1456"
    environment:
      OCR_GITLAB_HOST: ${OCR_GITLAB_HOST:?set OCR_GITLAB_HOST to your GitLab Self-Hosted host}
      OCR_GITLAB_CLIENT_ID: ${OCR_GITLAB_CLIENT_ID:?set OCR_GITLAB_CLIENT_ID to your GitLab OAuth Application ID}
      OCR_BIND: 0.0.0.0:8787
      OCR_DATA_DIR: /data
      # Read once at startup and removed from the environment, so no CLI the server runs sees them.
      OCR_DATABASE_URL_FILE: /run/ocr-db/app-url
      OCR_DATABASE_RO_URL_FILE: /run/ocr-db/ro-url
      OCR_DATABASE_OWNER_URL_FILE: /run/ocr-db/owner-url
      OCR_REPOS_DIR: /data/repos
      OCR_AUTO_REINDEX: "true"
      OCR_POLL_INTERVAL_SECONDS: "300"
      OCR_WEB_APP_URL: ${OCR_WEB_APP_URL:-http://localhost:1421}
      OCR_REVIEW_DEBUG_DIR: ${OCR_REVIEW_DEBUG_DIR:-}
      OCR_REVIEW_CLAUDE_AUTH_DIR: /review-claude-auth/app-managed
      # Every runner replica listens on its own socket here; the server finds them on its own.
      OCR_REVIEW_RUNNER_DIR: /review-ipc
      OCR_ONBOARDING_HTML_PATH: /app/assets/onboarding.html
      XDG_CONFIG_HOME: /data/xdg-config
      XDG_DATA_HOME: /data/xdg-data
      OCR_CLAUDE_TOKEN_PATH: /data/claude/oauth-token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ocr-data:/data
      - review-claude-auth:/review-claude-auth
      - review-ipc:/review-ipc
      - database-secret:/run/ocr-db:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, db]

  # One isolated container per review stage at a time. Idle runners use almost no memory; set
  # OCR_REVIEW_RUNNERS to match how many reviews you want running at once.
  review-runner:
    <<: *review-runner
    deploy:
      replicas: ${OCR_REVIEW_RUNNERS:-20}
    networks: [review-runner-egress]
    volumes:
      - review-ipc:/ipc
      - review-claude-auth:/claude-auth:ro

  review-egress:
    <<: *review-image
    restart: unless-stopped
    command: [egress]
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    tmpfs:
      - /tmp:size=16m
      - /data:size=1m,mode=0700
    networks: [review-provider-egress, review-runner-egress]

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - server
    ports:
      - "1421:1421"
    volumes:
      - ocr-data:/data:ro

networks:
  default:
  db:
    internal: true
  review-provider-egress:
  review-runner-egress:
    internal: true

volumes:
  database-secret:
  postgres-data:
  review-claude-auth:
  review-ipc:
  ocr-data:
